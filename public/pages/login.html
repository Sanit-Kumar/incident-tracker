<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cybersecurity Incident Tracking System</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .login-card {
        background: white;
        width: 500px;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      .project-title {
        text-align: center;
        font-size: 20px;
        margin-bottom: 15px;
        color: #2563eb;
        font-weight: bold;
        line-height: 1.3;
      }

      h1 {
        text-align: center;
        margin-bottom: 10px;
        font-size: 32px;
      }

      .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 25px;
      }

      input {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
      }

      input:focus {
        outline: none;
        border: 1px solid #2563eb;
      }

      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        background: #2563eb;
        color: white;
        font-weight: bold;
      }

      button:hover {
        opacity: 0.9;
      }

      #message {
        text-align: center;
        margin-top: 15px;
        color: red;
      }
    </style>
  </head>

  <body>
    <div class="login-card">
      <h2 class="project-title">Cybersecurity Incident Tracking System</h2>

      <h1>Secure Login</h1>

      <p class="subtitle">Please login to continue</p>

      <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required />

        <input type="password" id="password" placeholder="Password" required />

        <button type="submit">Login</button>
      </form>

      <p id="message"></p>
    </div>

    <script src="../js/auth.js"></script>
  </body>
</html>
