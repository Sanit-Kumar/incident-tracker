<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Dashboard</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f4f6f9;
      }

      .container {
        width: 90%;
        max-width: 1000px;
        margin: 40px auto;
      }

      .header {
        background: white;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 20px;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
      }

      .card {
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .card a {
        text-decoration: none;
        font-weight: bold;
      }

      .logout {
        margin-top: 20px;
      }

      button {
        padding: 10px 20px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1>Employee Dashboard</h1>
        <p id="welcomeText"></p>
      </div>

      <div class="cards">
        <div class="card">
          <h2>Report Incident</h2>
          <br />
          <a href="report-incident.html"> Open </a>
        </div>

        <div class="card">
          <h2>My Incidents</h2>
          <br />
          <a href="my-incidents.html"> Open </a>
        </div>
      </div>

      <div class="logout">
        <button id="logoutBtn">Logout</button>
      </div>
    </div>

    <script src="../js/employee.js"></script>
  </body>
</html>
