<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Dashboard</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f4f6f9;
      }

      .container {
        width: 90%;
        max-width: 1200px;
        margin: 40px auto;
      }

      .header {
        background: white;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 20px;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
      }

      .card {
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .card h2 {
        margin-bottom: 10px;
      }

      .actions {
        margin-top: 30px;
        display: flex;
        gap: 20px;
      }

      a {
        text-decoration: none;
        font-weight: bold;
      }

      button {
        margin-top: 20px;
        padding: 10px 20px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1>Admin Dashboard</h1>
      </div>

      <div class="cards">
        <div class="card">
          <h2>Total Incidents</h2>
          <h1 id="totalIncidents">0</h1>
        </div>

        <div class="card">
          <h2>Open Incidents</h2>
          <h1 id="openIncidents">0</h1>
        </div>

        <div class="card">
          <h2>Resolved Incidents</h2>
          <h1 id="resolvedIncidents">0</h1>
        </div>

        <div class="card">
          <h2>High Severity</h2>
          <h1 id="highSeverity">0</h1>
        </div>
      </div>

      <div class="actions">
        <a href="admin-incidents.html"> Manage Incidents </a>

        <a href="create-employee.html"> Create Employee </a>
      </div>

      <button id="adminLogoutBtn">Logout</button>
    </div>

    <script src="../js/admin.js"></script>
  </body>
</html>
